map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

map cmd+p close_session
map cmd+r goto_session -1

map cmd+f show_last_command_output
map cmd+g show_scrollback

map cmd+t new_tab_with_cwd
map cmd+n new_os_window_with_cwd

map cmd+x toggle_layout stack
map cmd+z toggle_layout stack

map cmd+ctrl+m  layout_action rotate
map cmd+shift+m layout_action rotate

map cmd+ctrl+;  resize_window reset
map cmd+shift+; resize_window reset

map alt+backspace  send_key ctrl+w
map cmd+backspace  send_key ctrl+u
map ctrl+backspace send_key ctrl+w

map cmd+0 change_font_size current 0
map cmd+- change_font_size current -1.0
map cmd+= change_font_size current +1.0

map cmd+h neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right

map cmd+ctrl+h move_window left
map cmd+ctrl+j move_window down
map cmd+ctrl+k move_window up
map cmd+ctrl+l move_window right

map cmd+shift+h resize_window narrower
map cmd+shift+j resize_window shorter
map cmd+shift+k resize_window taller
map cmd+shift+l resize_window wider

map cmd+enter       launch --location=vsplit --cwd=current
map cmd+ctrl+enter  launch --location=hsplit --cwd=current
map cmd+shift+enter launch --location=hsplit --cwd=current

map cmd+a launch --type=overlay $HOME/.config/kitty/scripts/kitty-session --active
map cmd+s launch --type=overlay $HOME/.config/kitty/scripts/kitty-session

map cmd+d launch --type=overlay $HOME/.config/kitty/scripts/kitty-tabs
map cmd+e launch --type=overlay $HOME/.config/kitty/scripts/kitty-tabs --all
