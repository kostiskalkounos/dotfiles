###########################################################
# Symbols Nerd Font complete symbol_map (v3.x aligned)
# Troubleshoot missing/incorrect characters with:
#   kitty --debug-font-fallback
###########################################################

# "Nerd Fonts - Pomicons"
symbol_map U+e000-U+e00a Symbols Nerd Font

# "Nerd Fonts - Powerline"
symbol_map U+e0a0-U+e0a2,U+e0b0-U+e0b3 Symbols Nerd Font

# "Nerd Fonts - Powerline Extra"
symbol_map U+2630,U+e0a3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7 Symbols Nerd Font

# "Nerd Fonts - Symbols original" (Seti-UI + Custom)
symbol_map U+e5fa-U+e6b7 Symbols Nerd Font

# "Nerd Fonts - Devicons"
symbol_map U+e700-U+e8ef Symbols Nerd Font

# "Nerd Fonts - Font Awesome"
symbol_map U+f000-U+f2ff Symbols Nerd Font

# "Nerd Fonts - Font Awesome Extension"
symbol_map U+e200-U+e2a9 Symbols Nerd Font

# "Nerd Fonts - Font Awesome 5/6"
symbol_map U+ed00-U+efce Symbols Nerd Font

# "Nerd Fonts - Octicons"
symbol_map U+f400-U+f533,U+2665,U+26a1 Symbols Nerd Font

# "Nerd Fonts - Font Logos" (Formerly Font Linux)
symbol_map U+f300-U+f381 Symbols Nerd Font

# "Nerd Fonts - Font Power Symbols" (IEC Power Symbols)
symbol_map U+23fb-U+23fe,U+2b58 Symbols Nerd Font

# "Nerd Fonts - Material Design Icons" (Relocated in v3)
symbol_map U+f0001-U+f1af0 Symbols Nerd Font

# "Nerd Fonts - Weather Icons"
symbol_map U+e300-U+e3e3 Symbols Nerd Font

# "Nerd Fonts - Codicons"
symbol_map U+ea60-U+ec1e Symbols Nerd Font

# "Nerd Fonts - Progress Indicators" (Spinners)
symbol_map U+ee00-U+ee0b Symbols Nerd Font

# "Nerd Fonts - Heavy Angle Brackets"
symbol_map U+276c-U+2771 Symbols Nerd Font
